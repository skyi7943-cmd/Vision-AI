<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="100%" height="100%">
  <!-- Phone Frame -->
  <rect x="6" y="6" width="408" height="848" rx="42" fill="#0B0F17" stroke="#334155" stroke-width="4"/>
  <rect x="18" y="18" width="384" height="824" rx="32" fill="#141820"/>

  <!-- Dimmed Scrim Outside Board -->
  <rect x="18" y="18" width="384" height="228" rx="32" fill="#080D14" fill-opacity="0.88"/>
  <rect x="18" y="630" width="384" height="212" rx="32" fill="#080D14" fill-opacity="0.88"/>

  <!-- Top Instruction Banner -->
  <rect x="30" y="54" width="360" height="86" rx="16" fill="#0F1924" stroke="#34D399" stroke-width="1.5"/>
  <text x="210" y="80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34D399">游戏内 8×8 棋盘校准 (贴合棋盘外框)</text>
  <text x="210" y="102" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#CBD5E1">拖动四角手柄或点击「铺满宽」对齐 64 格，透明窗口直视原棋盘</text>
  <text x="210" y="124" font-family="monospace" font-size="11" text-anchor="middle" fill="#38BDF8">区域: (0.0%, 30.4%) - (100.0%, 76.6%) · 正方形锁定</text>

  <!-- Crystal-Clear Cutout Chessboard (x=18..402, y=246..630) -->
  <g transform="translate(18, 246)">
    <!-- Subtle underlying board colors -->
    <rect x="0" y="0" width="384" height="384" fill="#739552"/>
    <!-- Light squares -->
    <g fill="#EBECD0">
      <rect x="0" y="0" width="48" height="48"/><rect x="96" y="0" width="48" height="48"/><rect x="192" y="0" width="48" height="48"/><rect x="288" y="0" width="48" height="48"/>
      <rect x="48" y="48" width="48" height="48"/><rect x="144" y="48" width="48" height="48"/><rect x="240" y="48" width="48" height="48"/><rect x="336" y="48" width="48" height="48"/>
      <rect x="0" y="96" width="48" height="48"/><rect x="96" y="96" width="48" height="48"/><rect x="192" y="96" width="48" height="48"/><rect x="288" y="96" width="48" height="48"/>
      <rect x="48" y="144" width="48" height="48"/><rect x="144" y="144" width="48" height="48"/><rect x="240" y="144" width="48" height="48"/><rect x="336" y="144" width="48" height="48"/>
      <rect x="0" y="192" width="48" height="48"/><rect x="96" y="192" width="48" height="48"/><rect x="192" y="192" width="48" height="48"/><rect x="288" y="192" width="48" height="48"/>
      <rect x="48" y="240" width="48" height="48"/><rect x="144" y="240" width="48" height="48"/><rect x="240" y="240" width="48" height="48"/><rect x="336" y="240" width="48" height="48"/>
      <rect x="0" y="288" width="48" height="48"/><rect x="96" y="288" width="48" height="48"/><rect x="192" y="288" width="48" height="48"/><rect x="288" y="288" width="48" height="48"/>
      <rect x="48" y="336" width="48" height="48"/><rect x="144" y="336" width="48" height="48"/><rect x="240" y="336" width="48" height="48"/><rect x="336" y="336" width="48" height="48"/>
    </g>

    <!-- 8x8 Calibration Grid Lines -->
    <g stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,4">
      <line x1="48" y1="0" x2="48" y2="384"/><line x1="96" y1="0" x2="96" y2="384"/><line x1="144" y1="0" x2="144" y2="384"/><line x1="192" y1="0" x2="192" y2="384"/><line x1="240" y1="0" x2="240" y2="384"/><line x1="288" y1="0" x2="288" y2="384"/><line x1="336" y1="0" x2="336" y2="384"/>
      <line x1="0" y1="48" x2="384" y2="48"/><line x1="0" y1="96" x2="384" y2="96"/><line x1="0" y1="144" x2="384" y2="144"/><line x1="0" y1="192" x2="384" y2="192"/><line x1="0" y1="240" x2="384" y2="240"/><line x1="0" y1="288" x2="384" y2="288"/><line x1="0" y1="336" x2="384" y2="336"/>
    </g>

    <!-- Outer Calibration Border -->
    <rect x="0" y="0" width="384" height="384" fill="none" stroke="#10B981" stroke-width="3.5"/>

    <!-- Corner Drag Handles -->
    <circle cx="0" cy="0" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="384" cy="0" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="384" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="384" cy="384" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>

    <!-- Center Crosshair -->
    <circle cx="192" cy="192" r="18" fill="#0F172A" fill-opacity="0.75" stroke="#38BDF8" stroke-width="2"/>
    <line x1="180" y1="192" x2="204" y2="192" stroke="#38BDF8" stroke-width="2"/>
    <line x1="192" y1="180" x2="192" y2="204" stroke="#38BDF8" stroke-width="2"/>

    <!-- Coordinate Labels a-h -->
    <g font-family="monospace" font-size="11" font-weight="bold" fill="#052E16" text-anchor="middle">
      <text x="24" y="378">a</text><text x="72" y="378">b</text><text x="120" y="378">c</text><text x="168" y="378">d</text><text x="216" y="378">e</text><text x="264" y="378">f</text><text x="312" y="378">g</text><text x="360" y="378">h</text>
    </g>
  </g>

  <!-- Bottom Floating Calibration Control Panel -->
  <g transform="translate(26, 646)">
    <rect x="0" y="0" width="368" height="178" rx="18" fill="#0F1924" stroke="#334155" stroke-width="1.5"/>

    <!-- Row 1: Smart Snap & Aspect Lock -->
    <rect x="12" y="12" width="110" height="34" rx="9" fill="#0284C7"/>
    <text x="67" y="34" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">✨ AI自动贴合</text>

    <rect x="129" y="12" width="110" height="34" rx="9" fill="#0D9488"/>
    <text x="184" y="34" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">↔ 铺满屏宽1:1</text>

    <rect x="246" y="12" width="110" height="34" rx="9" fill="#065F46" stroke="#34D399" stroke-width="1"/>
    <text x="301" y="34" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#A7F3D0">1:1 正方形:开</text>

    <!-- Row 2: Side & Fine Nudge -->
    <rect x="12" y="54" width="110" height="32" rx="8" fill="#1E293B"/>
    <text x="67" y="75" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#E2E8F0">♔ 执白 (下白上黑)</text>

    <g transform="translate(129, 54)" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">
      <rect x="0" y="0" width="34" height="32" rx="7" fill="#334155"/><text x="17" y="21">◀</text>
      <rect x="38" y="0" width="34" height="32" rx="7" fill="#334155"/><text x="55" y="21">▲</text>
      <rect x="76" y="0" width="34" height="32" rx="7" fill="#334155"/><text x="93" y="21">▼</text>
      <rect x="114" y="0" width="34" height="32" rx="7" fill="#334155"/><text x="131" y="21">▶</text>
      <rect x="152" y="0" width="34" height="32" rx="7" fill="#334155"/><text x="169" y="21">－</text>
      <rect x="190" y="0" width="37" height="32" rx="7" fill="#334155"/><text x="208" y="21">＋</text>
    </g>

    <!-- Row 3: Reset / Cancel / Save / Save & Analyze -->
    <rect x="12" y="98" width="74" height="40" rx="10" fill="#334155"/>
    <text x="49" y="123" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#CBD5E1">重置默认</text>

    <rect x="92" y="98" width="66" height="40" rx="10" fill="#475569"/>
    <text x="125" y="123" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#F8FAFC">取消</text>

    <rect x="164" y="98" width="82" height="40" rx="10" fill="#059669"/>
    <text x="205" y="123" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">仅保存</text>

    <rect x="252" y="98" width="104" height="40" rx="10" fill="#10B981"/>
    <text x="304" y="123" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#052E16">✓ 保存并分析</text>

    <text x="184" y="160" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#94A3B8">点击「保存并分析」将立即对框选的 8×8 区域执行局部裁剪识别与走法推荐</text>
  </g>
</svg>
